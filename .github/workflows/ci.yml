name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # PHPStan resolves CMSPlugin, the scheduler's TaskPluginTrait and the
      # database classes against a real Joomla. /joomla is git-ignored, so CI
      # fetches its own.
      - name: Fetch Joomla
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla
        env:
          JOOMLA_VERSION: 6.1.4

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs
