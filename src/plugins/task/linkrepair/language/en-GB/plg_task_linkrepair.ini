PLG_TASK_LINKREPAIR="Task - Link Repair"
PLG_TASK_LINKREPAIR_XML_DESCRIPTION="Finds links in articles that were typed as URLs to pages of this site, and turns them into links to menu items, as the editor's CMS Content &gt; Menu button makes them. Two task types: a scan that reports, and a repair that changes the articles."

PLG_TASK_LINKREPAIR_SCAN_TITLE="Link repair: scan"
PLG_TASK_LINKREPAIR_SCAN_DESC="Reads all articles, finds links typed as URLs to pages of this site and works out which menu item each one means. Changes nothing; writes a CSV report to the log folder."
PLG_TASK_LINKREPAIR_REPAIR_TITLE="Link repair: repair"
PLG_TASK_LINKREPAIR_REPAIR_DESC="Turns the links found by the latest scan into links to menu items. Saves through the article editor's own model, so every change is in the article's version history. Dry run by default."

PLG_TASK_LINKREPAIR_FIELD_SITE_URL_LABEL="Site address"
PLG_TASK_LINKREPAIR_FIELD_SITE_URL_DESC="The address of this site, such as https://guide.joomla.org, or http://localhost/site for a site in a folder. A task run from the command line cannot find this out by itself."
PLG_TASK_LINKREPAIR_FIELD_OTHER_HOSTS_LABEL="Other host names"
PLG_TASK_LINKREPAIR_FIELD_OTHER_HOSTS_DESC="More host names that are the same site, one per line, such as www.example.org. Links to them count as internal too."
PLG_TASK_LINKREPAIR_FIELD_FOLLOW_REDIRECTS_LABEL="Follow redirects"
PLG_TASK_LINKREPAIR_FIELD_FOLLOW_REDIRECTS_DESC="When no menu item has a link's path, ask the site where the link ends up (its redirects, for example from .htaccess) and look that up. Only this site's own host names are ever requested."
PLG_TASK_LINKREPAIR_FIELD_TIME_BUDGET_LABEL="Time per run (seconds)"
PLG_TASK_LINKREPAIR_FIELD_TIME_BUDGET_DESC="How long one run may work. When there is more to do, the task stops, and the scheduler runs it again straight away to continue where it stopped."
PLG_TASK_LINKREPAIR_FIELD_DRY_RUN_LABEL="Dry run"
PLG_TASK_LINKREPAIR_FIELD_DRY_RUN_DESC="Log what would change, without saving anything. Switch this off to repair."
PLG_TASK_LINKREPAIR_FIELD_AS_USER_LABEL="Record changes as"
PLG_TASK_LINKREPAIR_FIELD_AS_USER_DESC="The user shown as 'Modified by' and in the version history of repaired articles. A dedicated user, such as 'Link repair', makes the changes easy to recognise."

PLG_TASK_LINKREPAIR_LOG_NOT_CONFIGURED="The task is not configured: %s"
PLG_TASK_LINKREPAIR_LOG_FAILED="Link repair stopped: %s"
